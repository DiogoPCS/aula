<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joguinho do Sapinho vs Sapinhos Vermelhos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2b4532;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #fff;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2rem;
            text-shadow: 2px 2px #111;
        }

        #scoreboard {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .game-container {
            position: relative;
        }

        canvas {
            border: 4px solid #fff;
            border-radius: 8px;
            background: #4caf50;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            display: block;
        }

        /* Tela de Game Over estilizada */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        #gameOverScreen h2 {
            font-size: 2.2rem;
            color: #ff5252;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }

        #gameOverScreen p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        #restartBtn {
            background-color: #8bc34a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        #restartBtn:hover {
            background-color: #7cb342;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #c8e6c9;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🐸 Joguinho do Sapinho</h1>
    <div id="scoreboard">Placar: <span id="score">0</span> | Fase: <span id="level">1</span></div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Tela de Game Over embutida -->
        <div id="gameOverScreen">
            <h2>Game Over!</h2>
            <p>Os sapinhos vermelhos te pegaram!<br>Pontuação final: <span id="finalScore">0</span></p>
            <button id="restartBtn" onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <div class="instructions">
        Use as **Setas** ou **W, A, S, D** para fugir dos **Sapinhos Vermelhos** e pegar as moscas!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let level = 1;
        let gameSpeed = 480; // Velocidade ainda mais devagar e relaxada (tempo em milissegundos por passo)
        let isGameOver = false;

        // Posições iniciais padrão
        const originalFrogPos = { x: 10, y: 10 };
        let frog = { x: 10, y: 10 };
        let fly = { x: 5, y: 5 };
        let redFrogs = [];

        let changingDirection = false;

        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            if (isGameOver || changingDirection) return;

            const key = event.key;
            
            if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && frog.x > 0) {
                frog.x--;
                changingDirection = true;
            }
            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && frog.y > 0) {
                frog.y--;
                changingDirection = true;
            }
            if ((key === 'ArrowRight' || key === 'd' || key === 'D') && frog.x < tileCount - 1) {
                frog.x++;
                changingDirection = true;
            }
            if ((key === 'ArrowDown' || key === 's' || key === 'S') && frog.y < tileCount - 1) {
                frog.y++;
                changingDirection = true;
            }

            setTimeout(() => { changingDirection = false; }, 120);
            checkCollision();
        }

        function randomFly() {
            fly.x = Math.floor(Math.random() * tileCount);
            fly.y = Math.floor(Math.random() * tileCount);
        }

        function checkCollision() {
            if (isGameOver) return;

            // Pegou a mosca (Passou de fase/subiu de nível)
            if (frog.x === fly.x && frog.y === fly.y) {
                score += 10;
                level++;
                scoreElement.innerText = score;
                levelElement.innerText = level;
                
                randomFly();
                
                // Reposiciona o sapo no ponto de origem
                frog.x = originalFrogPos.x;
                frog.y = originalFrogPos.y;

                // Adiciona um novo sapinho vermelho nas bordas
                redFrogs.push({
                    x: Math.random() > 0.5 ? 0 : tileCount - 1,
                    y: Math.random() > 0.5 ? 0 : tileCount - 1
                });
                
                // Reposiciona todos os inimigos nas bordas ao passar de fase para dar respiro
                redFrogs.forEach(enemy => {
                    enemy.x = Math.random() > 0.5 ? 0 : tileCount - 1;
                    enemy.y = Math.random() > 0.5 ? 0 : tileCount - 1;
                });
            }
        }

        function updateGame() {
            if (isGameOver) return;

            redFrogs.forEach(enemy => {
                if (enemy.x < frog.x) enemy.x++;
                else if (enemy.x > frog.x) enemy.x--;

                if (enemy.y < frog.y) enemy.y++;
                else if (enemy.y > frog.y) enemy.y--;

                // Game Over se o sapinho vermelho encostar no seu sapo
                if (enemy.x === frog.x && enemy.y === frog.y) {
                    triggerGameOver();
                }
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'flex';
            clearInterval(gameInterval);
        }

        function restartGame() {
            score = 0;
            level = 1;
            gameSpeed = 480;
            isGameOver = false;
            
            scoreElement.innerText = score;
            levelElement.innerText = level;
            
            frog.x = originalFrogPos.x;
            frog.y = originalFrogPos.y;
            
            redFrogs = []; // Começa sem sapinhos vermelhos
            randomFly();
            
            gameOverScreen.style.display = 'none';
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function drawGame() {
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha a Mosca
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.arc(
                (fly.x * gridSize) + gridSize / 2,
                (fly.y * gridSize) + gridSize / 2,
                gridSize / 3,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Desenha o Sapo Principal (Verde)
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(frog.x * gridSize + 2, frog.y * gridSize + 2, gridSize - 4, gridSize - 4);
            
            ctx.fillStyle = '#000';
            ctx.fillRect(frog.x * gridSize + 4, frog.y * gridSize + 4, 3, 3);
            ctx.fillRect(frog.x * gridSize + 13, frog.y * gridSize + 4, 3, 3);

            // Desenha os Sapinhos Vermelhos (Inimigos)
            redFrogs.forEach(enemy => {
                ctx.fillStyle = '#f44336';
                ctx.fillRect(enemy.x * gridSize + 2, enemy.y * gridSize + 2, gridSize - 4, gridSize - 4);

                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x * gridSize + 4, enemy.y * gridSize + 4, 3, 3);
                ctx.fillRect(enemy.x * gridSize + 13, enemy.y * gridSize + 4, 3, 3);
            });
        }

        function gameLoop() {
            updateGame();
            drawGame();
        }

        // Inicialização
        randomFly();
        let gameInterval = setInterval(gameLoop, gameSpeed);
    </script>

</body>
</html>
